# Alembic config for the metadata DB. The database URL comes from viz settings
# (VIZ_DATABASE_URL, or SQLite in the data dir), not from this file.
# Create a migration: uv run alembic revision --autogenerate -m "describe change"

[alembic]
script_location = backend/src/viz/meta/migrations
prepend_sys_path = backend/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
